<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="解題小幫手" />
    <title>解題小幫手 — 國高中康乃爾錯題本</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 2026-08-06 註冊「空殼 SW」：只為滿足 Chrome 安裝條件（beforeinstallprompt）
      // 不 cache 任何資源 → 不會有 08-02 的舊版快取問題
      // 順便清掉舊版 SW / 舊 cache（給之前被 cache 的使用者升級路徑）
      if ('serviceWorker' in navigator) {
        // 先清舊 cache
        if (window.caches) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)))
        }
        // 註冊新 SW（不 cache，純為安裝條件）
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // 註冊失敗不影響主流程，只是沒有安裝 banner
        })
      }
    </script>
  </body>
</html>
