<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="解題小幫手" />
    <title>解題小幫手 — 國高中康乃爾錯題本</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 2026-08-02 拿掉 Service Worker
      // SW 會 cache 舊版 shell，導致手機永遠用舊版（Vercel 部署後看不到新功能）
      // 解法：完全拿掉 SW，APP 純靠 IndexedDB 運作
      // 登入後主動清掉舊 SW（給已經被 cache 的使用者一個升級路徑）
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(reg => reg.unregister())
        })
        if (window.caches) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)))
        }
      }
    </script>
  </body>
</html>
